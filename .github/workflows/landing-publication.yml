name: Lectura — publication contrôlée de la landing Android

on:
  push:
    branches: ['arena/d2229c4f-lectura']
    paths: ['.github/workflows/landing-publication.yml', 'tools/landing-publication.py', 'app/**']
  workflow_dispatch:
    inputs:
      operation:
        description: 'Joindre le ZIP exact et publier uniquement la nouvelle landing /app/'
        required: true
        type: choice
        options: [publish-landing]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'pages' || 'landing-read-only-guard' }}
  cancel-in-progress: false

jobs:
  guard:
    if: github.repository == 'initDV/Lectura' && github.ref == 'refs/heads/arena/d2229c4f-lectura'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Borner le changement à la landing et à sa procédure de publication
        run: |
          set -euo pipefail
          base=ebd351498cdba9f97b4178846ddcfdcaac9e0884
          git merge-base --is-ancestor "$base" HEAD
          git diff --exit-code "$base" HEAD -- . ':!app/**' \
            ':!.github/workflows/landing-publication.yml' ':!tools/landing-publication.py'
          python3 tools/landing-publication.py validate
          node --check app/reveal.js

  archive:
    needs: guard
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-landing'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Joindre le ZIP de recette à la Release existante et vérifier les deux téléchargements
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/landing-publication.py archive "$RUNNER_TEMP/lectura-archive"

  snapshot:
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Vérifier la PWA publique et remplacer uniquement app dans sa copie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/landing-publication.py snapshot \
            "$RUNNER_TEMP/landing-site" "$RUNNER_TEMP/site-sha256.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preuve-landing-sha256
          path: ${{ runner.temp }}/site-sha256.json
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/landing-site

  deploy:
    needs: snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}app/
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preuve-landing-sha256
          path: ${{ runner.temp }}/landing-proof
      - name: Confirmer la référence juste avant publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/landing-publication.py guard
      - id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Vérifier la landing publique et comparer les fichiers de la PWA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/landing-publication.py verify "$RUNNER_TEMP/landing-proof/site-sha256.json"
