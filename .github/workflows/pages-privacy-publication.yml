name: Lectura — publier la politique de confidentialité seule

on:
  push:
    branches: ['arena/d2229c4f-lectura']
    paths: ['.github/workflows/pages-privacy-publication.yml']

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  deployments: read

jobs:
  snapshot:
    if: github.repository == 'initDV/Lectura' && github.ref == 'refs/heads/arena/d2229c4f-lectura'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Ajouter uniquement la politique au site actuel
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/apkpure/publish-privacy.py snapshot "$RUNNER_TEMP/privacy-site" "$RUNNER_TEMP/privacy-sha256.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: privacy-inventaire
          path: ${{ runner.temp }}/privacy-sha256.json
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/privacy-site
      - name: Vérifier l’archive Pages
        run: |
          tar -xOf "$RUNNER_TEMP/artifact.tar" './.nojekyll' > "$RUNNER_TEMP/nojekyll-check"
          test ! -s "$RUNNER_TEMP/nojekyll-check"
          tar -xOf "$RUNNER_TEMP/artifact.tar" './privacy/index.html' | cmp - privacy/index.html

  deploy:
    needs: snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: privacy-inventaire
          path: ${{ runner.temp }}/privacy-proof
      - name: Vérifier le déploiement de référence avant publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/apkpure/publish-privacy.py guard
      - id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Contrôler la page publique et le site existant
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/apkpure/publish-privacy.py verify "$RUNNER_TEMP/privacy-proof/privacy-sha256.json"
