name: Lectura Linux — remise ponctuelle des fichiers vérifiés

on:
  workflow_dispatch:
    inputs:
      run:
        description: 'Exécution réussie de la recette Linux'
        required: true
        type: string
      artifact:
        description: 'ID de l’artefact de cette exécution'
        required: true
        type: string
      digest:
        description: 'SHA-256 attesté par le stockage GitHub Actions'
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  transfer:
    if: github.repository == 'initDV/Lectura' && github.ref == 'refs/heads/arena/d2229c4f-lectura'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Remettre l’artefact exact, sans toucher aux branches ou Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run }}
          ARTIFACT: ${{ inputs.artifact }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          [[ $RUN =~ ^[0-9]+$ && $ARTIFACT =~ ^[0-9]+$ && $DIGEST =~ ^[0-9a-f]{64}$ ]]
          api="repos/$GITHUB_REPOSITORY/actions"
          run="$(gh api "$api/runs/$RUN")"
          sha=$(jq -er --arg branch "$GITHUB_REF_NAME" '
            select(.conclusion == "success" and .head_branch == $branch and .path == ".github/workflows/linux.yml") | .head_sha' <<< "$run")
          size=$(gh api "$api/runs/$RUN/artifacts" | jq -er --arg sha "$sha" --arg digest "sha256:$DIGEST" --arg id "$ARTIFACT" '
            .artifacts[] | select((.id | tostring) == $id
              and (.name == "Lectura-Linux-amd64-deb" or .name == "Apercu-Lectura-debian-12")
              and .workflow_run.head_sha == $sha and .digest == $digest and .expired == false
              and .size_in_bytes > 0 and .size_in_bytes <= 4194304) | .size_in_bytes')
          archive="$RUNNER_TEMP/lectura-linux-ci.zip"
          gh api "$api/artifacts/$ARTIFACT/zip" > "$archive"
          [[ $(wc -c < "$archive") == "$size" ]]
          printf '%s  %s\n' "$DIGEST" "$archive" | sha256sum -c -
          # Temporary provider transfer to the workspace when the artifact redirect is not accessible.
          # No commit, ref or public release is made for this object.
          blob=$(python3 -c 'import base64,json,sys; print(json.dumps({"encoding":"base64","content":base64.b64encode(sys.stdin.buffer.read()).decode()}))' \
            < "$archive" | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha')
          [[ $blob =~ ^[0-9a-f]{40}$ ]]
          echo "::notice title=Remise du fichier Linux::Artéfact $ARTIFACT ; blob $blob ; SHA-256 $DIGEST"
