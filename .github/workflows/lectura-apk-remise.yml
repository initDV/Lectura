name: Lectura Android — remise ponctuelle du candidat signé

on:
  push:
    branches: ['arena/d2229c4f-lectura']
    paths: ['.github/workflows/lectura-apk-remise.yml']

permissions: {}

jobs:
  transfer:
    if: github.repository == 'initDV/Lectura' && github.ref == 'refs/heads/arena/d2229c4f-lectura'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      actions: read
      contents: write
    steps:
      - name: Remettre exactement le candidat de la recette Android 44, sans publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          digest=20833513a23d620aedd9a90163e2f05d2bb7e91019929d130a2bc2ad3522df5d
          source=e57a1d84b6512fda62b7055dce02196d19d61dff
          api="repos/$GITHUB_REPOSITORY/actions"
          gh api "$api/runs/45890313853" | jq -e --arg source "$source" --arg branch "$GITHUB_REF_NAME" '
            .conclusion == "success" and .head_sha == $source and .head_branch == $branch
            and .path == ".github/workflows/android.yml" and .run_number == 44' >/dev/null
          gh api "$api/artifacts/15151671922" | jq -e --arg source "$source" --arg digest "sha256:$digest" '
            .name == "Lectura-Android-API31+" and .digest == $digest and .expired == false and .size_in_bytes == 71320809
            and .workflow_run.id == 45890313853 and .workflow_run.head_sha == $source' >/dev/null
          cd "$RUNNER_TEMP"
          gh api "$api/artifacts/15151671922/zip" > lectura-44.zip
          printf '%s  %s\n' "$digest" lectura-44.zip | sha256sum -c -
          [[ $(unzip -Z1 lectura-44.zip) == Lectura.apk ]]
          sha=$(unzip -p lectura-44.zip Lectura.apk | sha256sum | cut -d ' ' -f 1)
          # The storage download redirect is not reachable from the workbench.
          # Transfer in unreferenced parts only: do not add a file, commit, tree, tag or Release.
          split -b 2097152 -d -a 2 lectura-44.zip lectura-part-
          printf '%s\0' lectura-part-* | xargs -0 -P 4 -I '{}' bash -euo pipefail -c '
            part=$1
            expected=$(git hash-object "$part")
            blob=$(python3 -c '\''import base64,json,sys; json.dump({"encoding":"base64","content":base64.b64encode(sys.stdin.buffer.read()).decode()},sys.stdout)'\'' \
              < "$part" | gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)
            [[ $blob == "$expected" ]]
            printf "%s\n" "$blob" > "part-hash-${part##*-}"
          ' upload '{}'
          jq -n -c --arg sha "$sha" --arg digest "$digest" --arg parts "$(cat part-hash-*)" '
            {artifact:15151671922, run:45890313853, apk_sha256:$sha, zip_sha256:$digest, parts:($parts | split("\n"))}' > manifest.json
          echo "::notice title=Manifeste de remise de l’APK::$(cat manifest.json)"
