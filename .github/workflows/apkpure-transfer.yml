name: Lectura — remettre le dossier vérifié à l’espace de travail

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: 'ID de l’archive CI de Lectura'
        required: true
        type: string
      digest:
        description: 'SHA-256 attendu de l’archive'
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  transfer:
    if: github.repository == 'initDV/Lectura' && github.ref == 'refs/heads/arena/d2229c4f-lectura'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Relayer les octets exacts sans modifier de fichier, référence, branche ou Release
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ inputs.artifact }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          [[ $ARTIFACT =~ ^[0-9]+$ && $DIGEST =~ ^[0-9a-f]{64}$ ]]
          api="repos/initDV/Lectura/actions/artifacts/$ARTIFACT"
          size=$(gh api "$api" | jq -er --arg digest "sha256:$DIGEST" '
            select((.name == "Lectura-APKPure-v1.0.0" or .name == "privacy-inventaire" or .name == "Diagnostic-APKPure")
              and .digest == $digest and .expired == false and .size_in_bytes > 0 and .size_in_bytes <= 15728640
              and .workflow_run.head_branch == "arena/d2229c4f-lectura") | .size_in_bytes')
          archive="$RUNNER_TEMP/lectura-ci-artifact.zip"
          gh api "$api/zip" > "$archive"
          [[ $(wc -c < "$archive") == "$size" ]]
          printf '%s  %s\n' "$DIGEST" "$archive" | sha256sum -c -
          # An unreferenced blob provides an api.github.com retrieval path when the
          # consumer cannot follow the artifact-storage redirect. No commit or ref.
          blob=$(python3 -c 'import base64,json,sys; print(json.dumps({"encoding":"base64","content":base64.b64encode(sys.stdin.buffer.read()).decode()}))' \
              < "$archive" | gh api --method POST repos/initDV/Lectura/git/blobs --input - --jq '.sha')
          [[ $blob =~ ^[0-9a-f]{40}$ ]]
          echo "::notice title=Objet de remise du dossier::Artéfact $ARTIFACT ; blob $blob ; SHA-256 $DIGEST"
