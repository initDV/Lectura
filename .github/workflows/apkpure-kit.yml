name: Lectura — dossier APKPure de la version publique

on:
  push:
    branches: ['arena/d2229c4f-lectura']
    paths: ['.github/workflows/apkpure-kit.yml', 'tools/apkpure/capture.py', 'tools/apkpure/emulator.sh']

permissions:
  contents: read

jobs:
  kit:
    if: github.repository == 'initDV/Lectura' && github.ref == 'refs/heads/arena/d2229c4f-lectura'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AVD_IMAGE: 'system-images;android-36;google_apis;x86_64'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Télécharger l’APK exact de la Release en lecture seule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/initDV/Lectura/releases/tags/v1.0.0 | jq -e '
            .id == 455752281 and .draft == false and any(.assets[];
              .id == 783854847 and .name == "Lectura.apk" and .size == 71681981
              and .digest == "sha256:d2121f08964d98d6d3f5b1cc784daf18e41caaf34f5b5553a34356ec808f55c0")' >/dev/null
          curl -fsSL --retry 2 --max-time 120 -o "$RUNNER_TEMP/Lectura.apk" \
            'https://github.com/initDV/Lectura/releases/download/v1.0.0/Lectura.apk'
      - name: Préparer l’émulateur Android 16 et ses outils
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?}"
          test -c /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          set +o pipefail
          yes | sdkmanager --licenses > "$RUNNER_TEMP/lectura-sdk-licenses.txt"
          set -o pipefail
          sdkmanager platform-tools emulator 'build-tools;37.0.0' "$AVD_IMAGE"
          printf '%s\n' "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          packages=()
          for spec in espeak-ng:espeak-ng ffprobe:ffmpeg convert:imagemagick; do
            if ! command -v "${spec%:*}" >/dev/null; then packages+=("${spec#*:}"); fi
          done
          if (( ${#packages[@]} )); then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends "${packages[@]}"
          fi
      - name: Vérifier la signature et capturer l’application Android en FR et EN
        run: bash tools/apkpure/emulator.sh "$RUNNER_TEMP/lectura-apkpure" "$RUNNER_TEMP/Lectura.apk"
      - name: Ajouter l’icône, les textes et les bannières au dossier
        run: |
          set -euo pipefail
          kit="$RUNNER_TEMP/lectura-apkpure"
          mkdir "$kit/bannieres"
          git show 3c5ca6d5a02c1475ca121958bde923f44004af97:icons/512.png > "$RUNNER_TEMP/lectura-logo.png"
          convert "$RUNNER_TEMP/lectura-logo.png" -background '#101016' -alpha remove -alpha off -strip "PNG24:$kit/icone-512.png"
          python3 - "$RUNNER_TEMP" <<'PY'
          from base64 import b64encode
          from pathlib import Path
          import sys
          source = Path('tools/apkpure/banner.html').read_text()
          font = b64encode(Path('app/assets/space-grotesk-latin-wght-normal.woff2').read_bytes()).decode()
          source = source.replace('<style>', '<style>@font-face{font-family:"Space Grotesk";font-weight:300 700;'
                                  'src:url(data:font/woff2;base64,' + font + ') format("woff2");}')
          labels = {'Tes textes prennent voix.':'Give your words a voice.', '43 personnages':'43 characters', 'Hors ligne':'Offline'}
          Path(sys.argv[1], 'banner-FR.html').write_text(source)
          for fr, en in labels.items():
              source = source.replace(fr, en)
          Path(sys.argv[1], 'banner-EN.html').write_text(source.replace('lang="fr"', 'lang="en"'))
          PY
          for lang in FR EN; do
            google-chrome --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars \
              --force-device-scale-factor=1 --window-size=1024,500 --virtual-time-budget=2000 \
              --screenshot="$kit/bannieres/banniere-$lang-1024x500.png" "file://$RUNNER_TEMP/banner-$lang.html" \
              > "$RUNNER_TEMP/banner-$lang.log" 2>&1
          done
          python3 tools/apkpure/assemble.py "$kit"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lectura-APKPure-v1.0.0
          path: ${{ runner.temp }}/lectura-apkpure/
          if-no-files-found: error
          retention-days: 90
      - name: Conserver les éléments utiles au diagnostic en cas d’échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Diagnostic-APKPure
          path: |
            ${{ runner.temp }}/lectura-apkpure/
            ${{ runner.temp }}/capture-fixtures/ecran-echec.png
            ${{ runner.temp }}/capture-fixtures/interface-echec.txt
            ${{ runner.temp }}/capture-errors.txt
            ${{ runner.temp }}/emulator-capture.txt
            ${{ runner.temp }}/banner-*.log
          if-no-files-found: ignore
          retention-days: 7
