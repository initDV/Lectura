name: Lectura — diagnostic de fin automatique sur Android 12

on:
  push:
    branches: ['arena/d2229c4f-lectura']
    paths: ['.github/workflows/lectura-diagnostic-android.yml']

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'initDV/Lectura'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Préparer une itération locale de la recette, sans clé de distribution
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-37.0/android.jar" && ! -f "$ANDROID_HOME/platforms/android-37/android.jar" ]]; then
            sdkmanager 'platforms;android-37.0'
          fi
          [[ -x "$ANDROID_HOME/build-tools/37.0.0/aapt2" ]] || sdkmanager 'build-tools;37.0.0'
          python3 -m pip install --user fonttools brotli
          python3 - <<'PY'
          from pathlib import Path
          checks = Path('android/tests/java/io/github/initdv/lectura/DeviceChecks.java')
          src = checks.read_text(); marker = '        switch(args.getString("mode","clean")){'
          assert src.count(marker) == 1
          checks.write_text(src.replace(marker, marker + '''
              case "mobile":
                  check("surfaces",()->surfaces(ctx));
                  check("quatre-gestes",()->robotChoreo(ctx,refs));
                  break;
              case "robot":
                  check("quatre-gestes",()->robotChoreo(ctx,refs));
                  break;'''))
          runner = Path('android/tests/emulator.sh')
          src = runner.read_text(); start = src.index('        instrument installation-en-avion DeviceChecks'); stop = src.index('        adb logcat -d -s', start)
          runner.write_text(src[:start] + '''        instrument portrait DeviceChecks -e mode mobile || failures=1
                  adb shell wm size 780x390
                  instrument paysage DeviceChecks -e mode robot || failures=1
          ''' + src[stop:])
          PY
          export LECTURA_KEYSTORE="$RUNNER_TEMP/diagnostic.p12"
          export LECTURA_STORE_PASS=$(openssl rand -hex 24)
          trap 'rm -f "$LECTURA_KEYSTORE"' EXIT
          keytool -genkeypair -keystore "$LECTURA_KEYSTORE" -storepass:env LECTURA_STORE_PASS \
            -alias lectura -dname 'CN=Lectura diagnostic ephemeral' -keyalg RSA -keysize 2048 -validity 1
          stamp=$(keytool -exportcert -keystore "$LECTURA_KEYSTORE" -storepass:env LECTURA_STORE_PASS -alias lectura | sha256sum)
          export LECTURA_SIGNING_CERT_SHA256=${stamp%% *}
          LECTURA_TEST_APK="$RUNNER_TEMP/LecturaTests.apk" bash android/build.sh "$RUNNER_TEMP/Lectura.apk"
      - name: Autoriser KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Recette de lecture et fin automatique en portrait et en paysage
        env:
          LECTURA_REPORT: ${{ runner.temp }}/lectura-report
        run: bash android/tests/emulator.sh "$RUNNER_TEMP/Lectura.apk" "$RUNNER_TEMP/LecturaTests.apk"
