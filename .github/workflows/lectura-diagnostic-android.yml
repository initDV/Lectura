name: Lectura — diagnostic du rapport Android 43

on:
  push:
    branches: ['arena/d2229c4f-lectura']
    paths: ['.github/workflows/lectura-diagnostic-android.yml']

permissions:
  actions: read

jobs:
  inspect:
    if: github.repository == 'initDV/Lectura'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Lectura-comparaison
          run-id: '45887746924'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/lectura-report
      - name: Examiner les erreurs de l’émulateur
        run: |
          python3 - "$RUNNER_TEMP/lectura-report" <<'PY'
          from pathlib import Path
          import sys

          def notice(title, text):
              print(f'::notice title={title}::' + text.replace('%','%25').replace('\n','%0A'))

          report = Path(sys.argv[1]); errors = report / 'android-errors.txt'
          lines = errors.read_text(errors='replace').splitlines() if errors.exists() else []
          notice('Logcat', f'{len(lines)} lignes. Fichiers : ' + ', '.join(p.name for p in report.iterdir()))
          useful = [line for line in lines if 'Lectura' in line or 'FATAL EXCEPTION' in line]
          for i in range(0, min(len(useful), 80), 10):
              notice(f'Lectura {i//10 + 1}', '\n'.join(useful[i:i+10])[:1900])
          for p in [report/'android-installation-en-avion.txt']:
              if not p.exists(): continue
              raw = p.read_text(errors='replace').splitlines()
              for i, line in enumerate(raw):
                  if line.startswith('LECTURA_ERROR '): notice('Assertion', '\n'.join(raw[i:i+7])[:1500])
          PY
