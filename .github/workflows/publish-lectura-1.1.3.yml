name: Publier Lectura Android 1.1.3

on:
  # Le push inscrit et vérifie le circuit, sans publier ni déployer.
  push:
    branches: ['arena/d2229c4f-lectura']
    paths: ['.github/workflows/publish-lectura-1.1.3.yml', 'tools/release-android-1.1.3.sh', 'tools/distribution/landing-update-1.1.3.py']
  workflow_dispatch:
    inputs:
      operation:
        description: 'Publier la Release ou mettre à jour uniquement la page de téléchargement'
        type: choice
        required: true
        options: [release, landing]
      run:
        description: 'Identifiant de la recette Android signée et réussie (release seulement)'
        type: string
      draft:
        description: 'Identifiant du brouillon v1.1.3 réservé (release seulement)'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.operation == 'landing' && 'pages' || 'lectura-android-release-v1.1.3' }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: |
          bash -n tools/release-android-1.1.3.sh
          python3 -m py_compile tools/distribution/landing-update-1.1.3.py

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'release' && github.repository == 'initDV/Lectura' && github.ref == 'refs/heads/arena/d2229c4f-lectura'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Vérifier et publier les octets du candidat signé
        env:
          GH_TOKEN: ${{ github.token }}
          RECETTE: ${{ inputs.run }}
          BROUILLON: ${{ inputs.draft }}
        run: bash tools/release-android-1.1.3.sh "$RECETTE" "$BROUILLON"

  landing:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'landing' && github.repository == 'initDV/Lectura' && github.ref == 'refs/heads/arena/d2229c4f-lectura'
    permissions:
      actions: read
      contents: read
      deployments: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      proof: ${{ steps.snapshot.outputs.proof }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Remplacer seulement app/index.html dans le site déjà publié
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run build
          python3 tools/distribution/landing-update-1.1.3.py prepare \
            "$RUNNER_TEMP/landing-pages" "$RUNNER_TEMP/landing-proof.json" "$RUNNER_TEMP/base-pages.zip" dist/app/index.html
          printf 'proof=%s\n' "$(jq -c . "$RUNNER_TEMP/landing-proof.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/landing-pages

  deploy-landing:
    needs: landing
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}app/
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Confirmer que la version publique de référence n’a pas changé
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/distribution/landing-update-1.1.3.py guard
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Relire le bouton public et vérifier que la PWA est inchangée
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF: ${{ needs.landing.outputs.proof }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          [[ $PAGE_URL == https://initdv.github.io/Lectura/ && -n $PROOF ]]
          printf '%s\n' "$PROOF" > "$RUNNER_TEMP/landing-proof.json"
          python3 tools/distribution/landing-update-1.1.3.py verify "$RUNNER_TEMP/landing-proof.json"
