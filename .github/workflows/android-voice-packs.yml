# Temporary, unsigned compatibility probe on the Android branch. No project data or secrets.
name: Contrat des packs de voix Android
on:
  push:
    branches: ['arena/d2229c4f-lectura']
    paths: ['.github/workflows/android-voice-packs.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspecter les fichiers publics (sans installer de voix ni les publier)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 2 'https://github.com/ByBrawe/Okuvia-models/releases/download/pocket-multilingual-preset-20261026/fr-pocket-tts-202610-preset.zip' -o estelle.zip
          echo '6068d9e5fa2b91c92bda8a3d874c34a3f99799cd5bef45634644b4e37febf718  estelle.zip' | sha256sum -c
          python3 - <<'PY'
          import zipfile, struct
          with zipfile.ZipFile('estelle.zip') as z:
              raw=z.read('voices/estelle.preset')
              print('::notice title=Preset Estelle::'+repr(raw[:288])+'%0A'+repr(raw[-88:])+'%0A'+repr([(i,raw[i:i+24].hex()) for i in [0,8,16,24,32,40,48,56,64,315392,315404,315456,630784,630832,946176,3785472]]))
              print('::notice title=Tokenizer Estelle::'+repr(z.read('models/tokenizer.model')[:180]))
          PY
