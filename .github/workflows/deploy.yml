# Déploiement automatique sur GitHub Pages à chaque « git push » sur main.
# Réglage à faire UNE fois sur GitHub : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: Déployer Lectura

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tests et vérification du code
        run: |
          npm test
          npm run lint
      # La voix HD (≈ 71 Mo) est téléchargée ici, par les serveurs de GitHub : la connexion du développeur n'est pas utilisée.
      - name: Cache de la voix Lectura HD
        id: voix
        uses: actions/cache@v4
        with:
          path: models
          key: voix-${{ hashFiles('tools/fetch_voice.mjs', 'package-lock.json') }}
      - name: Télécharger la voix Lectura HD
        if: steps.voix.outputs.cache-hit != 'true'
        run: npm run voice
      - name: Construire dist/
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
