name: Publier Lectura Android 1.1.6

on:
  push:
    branches: ['arena/d2229c4f-lectura']
    paths: ['.github/workflows/publish-lectura-1.1.6.yml', 'tools/release-android-1.1.6.sh']
  workflow_dispatch:
    inputs:
      android_run:
        description: 'Identifiant de la recette Android réussie pour ce commit'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: lectura-android-release-v1.1.6
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: bash -n tools/release-android-1.1.6.sh

  release:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'initDV/Lectura' && github.ref == 'refs/heads/arena/d2229c4f-lectura'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Vérifier et publier la recette signée
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_RUN: ${{ inputs.android_run }}
        run: bash tools/release-android-1.1.6.sh "$ANDROID_RUN"
