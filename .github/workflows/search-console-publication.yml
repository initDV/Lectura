name: Lectura — fichier de vérification Search Console

on:
  push:
    branches: ['arena/d2229c4f-lectura']
    paths: ['.github/workflows/search-console-publication.yml']
  workflow_dispatch:
    inputs:
      operation:
        description: 'Publier uniquement le fichier de vérification demandé'
        required: true
        type: choice
        options: [publish-verification]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'pages' || 'lectura-verification-read-only' }}
  cancel-in-progress: false

jobs:
  guard:
    if: github.repository == 'initDV/Lectura' && github.ref == 'refs/heads/arena/d2229c4f-lectura'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Vérifier le nom, le contenu et la portée du fichier
        run: |
          set -euo pipefail
          base=b945f6699f8494c1d20ca87c7f07409c6d0d671d
          git merge-base --is-ancestor "$base" HEAD
          git diff --exit-code "$base" HEAD -- . ':!google121a4ae782cb28f.html' \
            ':!.github/workflows/search-console-publication.yml' ':!tools/search-console-pages.py'
          python3 tools/search-console-pages.py validate

  snapshot:
    needs: guard
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Copier le site public puis ajouter le seul fichier de vérification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/search-console-pages.py snapshot \
            "$RUNNER_TEMP/verification-site" "$RUNNER_TEMP/verification-sha256.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preuve-verification-sha256
          path: ${{ runner.temp }}/verification-sha256.json
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/verification-site

  deploy:
    needs: snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}google121a4ae782cb28f.html
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preuve-verification-sha256
          path: ${{ runner.temp }}/verification-proof
      - name: Vérifier que le site n’a pas changé avant publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/search-console-pages.py guard
      - id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Vérifier le fichier HTTP 200 et les fichiers publics inchangés
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/search-console-pages.py verify "$RUNNER_TEMP/verification-proof/verification-sha256.json"
