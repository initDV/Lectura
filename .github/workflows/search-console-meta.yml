name: Lectura — balise de vérification Search Console

on:
  push:
    branches: ['arena/d2229c4f-lectura']
    paths: ['.github/workflows/search-console-meta.yml']
  workflow_dispatch:
    inputs:
      operation:
        description: 'Publier uniquement la balise de vérification de l’accueil'
        required: true
        type: choice
        options: [publish-google-meta]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'pages' || 'lectura-google-meta-read-only' }}
  cancel-in-progress: false

jobs:
  guard:
    if: github.repository == 'initDV/Lectura' && github.ref == 'refs/heads/arena/d2229c4f-lectura'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Vérifier que seul le head de l’accueil reçoit la balise
        run: |
          set -euo pipefail
          base=1b0b638f3b26b28dca1f29e60adb1da98004d199
          git merge-base --is-ancestor "$base" HEAD
          git diff --exit-code "$base" HEAD -- . ':!index.html' \
            ':!.github/workflows/search-console-meta.yml' ':!tools/search-console-meta.py'
          python3 tools/search-console-meta.py validate

  snapshot:
    needs: guard
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-google-meta'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Copier le site public avec la seule balise ajoutée à l’accueil
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/search-console-meta.py snapshot \
            "$RUNNER_TEMP/verification-meta-site" "$RUNNER_TEMP/verification-meta-sha256.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preuve-verification-meta-sha256
          path: ${{ runner.temp }}/verification-meta-sha256.json
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/verification-meta-site

  deploy:
    needs: snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preuve-verification-meta-sha256
          path: ${{ runner.temp }}/verification-proof
      - name: Vérifier que le site n’a pas changé avant publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/search-console-meta.py guard
      - id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Vérifier la balise publique et la conservation des autres fichiers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/search-console-meta.py verify "$RUNNER_TEMP/verification-proof/verification-meta-sha256.json"
