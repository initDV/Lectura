name: Vérification temporaire — APK publié sur Android 16

on:
  push:
    branches: ['arena/d2229c4f-lectura']
    paths: ['.github/workflows/apk-install-verification.yml']

permissions:
  actions: read
  contents: read

jobs:
  install:
    if: github.repository == 'initDV/Lectura' && github.ref == 'refs/heads/arena/d2229c4f-lectura'
    name: Installation Android 16 (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, pages-16k]
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Récupérer et vérifier les APK existants (lecture seule)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/lectura-android16-proof"
          mkdir -p "$REPORT"
          printf 'REPORT=%s\n' "$REPORT" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP"
          sha=d2121f08964d98d6d3f5b1cc784daf18e41caaf34f5b5553a34356ec808f55c0
          gh api repos/initDV/Lectura/releases/tags/v1.0.0 | jq -e --arg hash "sha256:$sha" '
            .id==455752281 and .draft==false and .target_commitish=="3c5ca6d5a02c1475ca121958bde923f44004af97"
            and any(.assets[]; .name=="Lectura.apk" and .id==783854847 and .digest==$hash and .size==71681981)
          ' >/dev/null
          curl -fsSL --retry 2 --max-time 120 -o Lectura.apk \
            'https://github.com/initDV/Lectura/releases/download/v1.0.0/Lectura.apk'
          printf '%s  Lectura.apk\n' "$sha" | sha256sum -c -
          if [[ $VARIANT == standard ]]; then
            zipsha=b29442eabec517a5254d8b99afc929cb99a75c7f9918af167c6005c7fa26ef8d
            gh api repos/initDV/Lectura/actions/artifacts/14839237347 | jq -e --arg hash "sha256:$zipsha" '
              .name=="Lectura-Android-API31+" and .expired==false and .digest==$hash
              and .workflow_run.id==45216757222 and .workflow_run.head_sha=="25884ca394f985b9c4fda36307df57672bbd1723"
            ' >/dev/null
            gh api repos/initDV/Lectura/actions/artifacts/14839237347/zip > predecessor.zip
            printf '%s  predecessor.zip\n' "$zipsha" | sha256sum -c -
            [[ $(unzip -Z1 predecessor.zip) == Lectura.apk ]]
            unzip -p predecessor.zip Lectura.apk > Lectura-31.apk
          fi
          printf 'SHA-256 de Lectura.apk : %s\n' "$sha" > "$REPORT/apk.txt"
      - name: Préparer un Android 16 vierge
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?SDK Android absent}"
          image='system-images;android-36;google_apis;x86_64'
          if [[ $VARIANT == pages-16k ]]; then
            image='system-images;android-36;google_apis_ps16k;x86_64'
          fi
          sdk=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -print -quit)
          [[ -x $sdk ]]
          if [[ $VARIANT == pages-16k && ! -d "$ANDROID_HOME/${image//;/\/}" ]]; then
            "$sdk" --list --channel=0 > "$RUNNER_TEMP/sdk-list.txt"
            if ! grep -Fq "$image" "$RUNNER_TEMP/sdk-list.txt"; then
              echo '::notice title=Image 16 Ko indisponible::Image Android 16 x86_64 16 Ko absente du canal stable ; cette variante n’est pas testée.'
              echo 'available=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          test -c /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          set +o pipefail
          yes | "$sdk" --licenses > "$RUNNER_TEMP/sdk-licenses.txt"
          set -o pipefail
          "$sdk" 'platform-tools' 'emulator' 'build-tools;37.0.0' "$image"
          printf '%s\n' "$(dirname "$sdk")" "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          printf 'AVD_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - name: Tester l’installation puis la mise à jour en place
        if: steps.sdk.outputs.available == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP"
          export ANDROID_SERIAL=emulator-5554
          export ANDROID_USER_HOME="$RUNNER_TEMP/lectura-android-home"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          pkg=io.github.initdv.lectura
          cert=b6873c0f1a2f447163fb9af7e6f4181280b31fd1f5c45b0535993075b3dc7d8b
          signer="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          emulator="$ANDROID_HOME/emulator/emulator"
          phase='validation des fichiers téléchargés'
          booted=0
          finish() {
            rc=$?
            if ((booted)); then
              timeout 15s adb logcat -d -s AndroidRuntime:E PackageManager:E > "$REPORT/android-errors.txt" 2>&1 || true
              timeout 15s adb exec-out screencap -p > "$REPORT/lectura.png" || true
            fi
            if ((rc)); then
              printf '::error title=Vérification Android 16::Échec : %s (statut %s).\n' "$phase" "$rc"
              if [[ $phase == 'démarrage de l’émulateur' ]]; then
                tail -n 35 "$REPORT/emulator.txt" || true
              fi
            fi
            timeout 10s adb emu kill >/dev/null 2>&1 || true
            exit "$rc"
          }
          trap finish EXIT
          assert_apk() {
            phase="signature de $1"
            "$signer" verify --verbose --print-certs "$RUNNER_TEMP/$1" > "$REPORT/$2-cert.txt" 2>&1 || {
              tail -n 10 "$REPORT/$2-cert.txt"
              return 1
            }
            cat "$REPORT/$2-cert.txt"
            phase="empreinte du certificat de $1"
            [[ $(awk '/certificate SHA-256 digest:/ {print $NF}' "$REPORT/$2-cert.txt") == "$cert" ]]
          }
          assert_apk Lectura.apk 32
          phase='démarrage de l’émulateur'
          printf 'no\n' | avdmanager create avd -f -n lectura_android16 -k "$AVD_IMAGE" -d pixel_4
          "$emulator" -accel-check
          "$emulator" -avd lectura_android16 -port 5554 -memory 4096 -no-window -gpu swiftshader_indirect \
            -no-snapshot -wipe-data -noaudio -no-boot-anim -camera-back none > "$REPORT/emulator.txt" 2>&1 &
          emu=$!
          for ((i=0; i<145; i++)); do
            if [[ $(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true) == 1 ]]; then
              booted=1; break
            fi
            kill -0 "$emu"
            sleep 2
          done
          [[ $booted == 1 && $(adb shell getprop ro.build.version.sdk | tr -d '\r') == 36 ]]
          [[ $(adb shell getprop ro.kernel.qemu | tr -d '\r') == 1 || $(adb shell getprop ro.boot.qemu | tr -d '\r') == 1 ]]
          page_size=$(adb shell getconf PAGE_SIZE | tr -d '\r')
          if [[ $VARIANT == pages-16k ]]; then [[ $page_size == 16384 ]]; else [[ $page_size == 4096 ]]; fi
          printf 'Android 16 (API 36), x86_64, taille de page : %s octets\n' "$page_size" | tee "$REPORT/systeme.txt"
          adb shell wm size 500x1000
          adb shell wm density 160
          for key in window_animation_scale transition_animation_scale animator_duration_scale; do
            adb shell settings put global "$key" 0
          done
          adb shell settings put secure immersive_mode_confirmations confirmed
          adb shell svc power stayon true
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard

          install_apk() {
            local label=$1 line
            shift
            if line=$(timeout 150s adb install "$@" 2>&1) && grep -Fxq Success <<< "${line//$'\r'/}"; then
              printf '%s\n' "$line" | tee "$REPORT/$label.txt"
            else
              printf '%s\n' "$line" | tee "$REPORT/$label.txt"
              line=${line//$'\r'/ }
              line=${line//$'\n'/ }
              printf '::error title=Installateur Android::%s\n' "${line//%/%25}"
              return 1
            fi
          }
          launch() {
            timeout 45s adb shell am start -W -n "$pkg/.MainActivity" | tee "$REPORT/$1.txt"
            grep -Fq 'Status: ok' "$REPORT/$1.txt"
            sleep 2
            adb shell pidof "$pkg"
          }
          package_record() {
            adb shell dumpsys package "$pkg" > "$REPORT/$1-package.txt"
            grep -Eq "^[[:space:]]*versionCode=$2([[:space:]]|$)" "$REPORT/$1-package.txt"
          }
          phase='installation de la Release sur l’image vierge'
          [[ -z $(adb shell pm path "$pkg" | tr -d '\r') ]]
          install_apk installation-propre Lectura.apk
          package_record release-propre 32
          launch lancement-propre
          printf '::notice title=Installation propre confirmée::Android 16 (API 36, x86_64, pages de %s octets) : l’APK exact de la Release, versionCode 32, s’installe et ouvre Lectura.\n' "$page_size"
          if [[ $VARIANT != standard ]]; then exit 0; fi

          assert_apk Lectura-31.apk 31
          phase='installation du prédécesseur sur l’émulateur de test'
          adb uninstall "$pkg" | grep -F Success
          install_apk installation-v31 Lectura-31.apk
          package_record avant 31
          launch lancement-v31

          # Un brouillon témoin est saisi dans l'interface, sans root ni modification de l'APK.
          cat > "$RUNNER_TEMP/draft-check.py" <<'PY'
          import re, subprocess, sys, time
          import xml.etree.ElementTree as ET
          mode = sys.argv[1]
          marker = 'BrouillonTemoinAndroid16'
          remote = '/data/local/tmp/lectura-ui.xml'
          def adb(*args):
              return subprocess.check_output(['adb', *args], stderr=subprocess.STDOUT, timeout=25)
          def nodes(predicate):
              for _ in range(5):
                  try:
                      adb('shell', 'uiautomator', 'dump', remote)
                      tree = ET.fromstring(adb('exec-out', 'cat', remote))
                      found = [e for e in tree.iter('node') if e.get('package') == 'io.github.initdv.lectura' and predicate(e)]
                      if found:
                          return found
                  except (ET.ParseError, subprocess.SubprocessError):
                      pass
                  time.sleep(0.5)
              return []
          def tap(e):
              x1, y1, x2, y2 = map(int, re.findall(r'\d+', e.attrib['bounds']))
              assert x2 > x1 and y2 > y1, 'Contrôle hors écran'
              adb('shell', 'input', 'tap', str((x1+x2)//2), str((y1+y2)//2))
          if mode == 'seed':
              skip = nodes(lambda e: e.get('text') in ('Passer', 'Skip'))
              if skip:
                  tap(skip[0])
              editor = nodes(lambda e: e.get('class') == 'android.widget.EditText')
              assert editor, 'Éditeur introuvable'
              tap(editor[0])
              adb('shell', 'input', 'text', marker)
          assert nodes(lambda e: e.get('class') == 'android.widget.EditText' and e.get('text') == marker), 'Brouillon témoin introuvable'
          print(f'{mode} : brouillon témoin retrouvé dans l’éditeur.')
          PY
          draft=0
          if timeout 150s python3 "$RUNNER_TEMP/draft-check.py" seed; then
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell am force-stop "$pkg"
            launch brouillon-v31
            if timeout 100s python3 "$RUNNER_TEMP/draft-check.py" verify; then draft=1; fi
          fi
          if [[ $draft == 0 ]]; then
            echo '::warning title=Brouillon non préparé::L’interface de test n’a pas permis de préparer le brouillon ; la mise à jour du paquet reste testée.'
          fi
          phase='mise à jour v31 → v32 sans désinstallation'
          install_apk mise-a-jour-v32 -r Lectura.apk
          package_record apres 32
          launch lancement-apres
          before=$(grep -m1 'firstInstallTime=' "$REPORT/avant-package.txt")
          after=$(grep -m1 'firstInstallTime=' "$REPORT/apres-package.txt")
          [[ -n $before && $before == "$after" ]]
          echo '::notice title=Mise à jour en place confirmée::API 36 : même certificat, v31 → v32 sans désinstaller, même date de première installation ; l’application s’ouvre.'
          if [[ $draft == 1 ]]; then
            phase='lecture du brouillon après mise à jour'
            timeout 100s python3 "$RUNNER_TEMP/draft-check.py" verify | tee "$REPORT/brouillon.txt"
            echo '::notice title=Brouillon conservé::Le brouillon saisi dans la version 31 réapparaît dans l’éditeur de la version 32 après mise à jour sur Android 16.'
          fi
      - name: Conserver les constats (sans APK)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preuve-android-16-${{ matrix.variant }}
          path: ${{ runner.temp }}/lectura-android16-proof
          retention-days: 7
          if-no-files-found: warn
